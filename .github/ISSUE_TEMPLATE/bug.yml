name: 问题反馈 / Bug report
description: 提供可复现的问题及脱敏环境信息
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请勿粘贴真实订阅、分享链接、控制密钥、完整配置或本地状态。安全问题请先阅读 SECURITY.md。'
  - type: input
    id: version
    attributes:
      label: Hermit 版本 / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS / 芯片 / Clash Verge Rev / Mihomo 版本
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options: [原生应用, Wails 开发模式, 浏览器 mock 预览]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构节点或文档示例地址描述操作。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏错误信息或截图
  - type: checkboxes
    id: redaction
    attributes:
      label: 提交前确认
      options:
        - label: 已移除真实节点、订阅、密钥与私人信息。
          required: true
