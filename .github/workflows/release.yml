name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.0.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install matching Wails CLI
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: Validate, build and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: bin/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd "release/$RELEASE_TAG"
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r '.isDraft' release-state.json)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Hermit $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz dependencies.json RELEASE_NOTES.md SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --title "Hermit $RELEASE_TAG" --notes-file RELEASE_NOTES.md
