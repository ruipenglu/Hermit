version: '3'

tasks:
  install:frontend:deps:
    dir: frontend
    sources: [package.json, package-lock.json]
    generates: [node_modules]
    cmds:
      - npm ci

  generate:bindings:
    cmds:
      - mkdir -p frontend/dist
      - touch frontend/dist/.gitkeep
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i

  build:frontend:
    cmds:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS: '{{.BUILD_FLAGS}}'
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} --prefix frontend

  generate:icons:
    dir: build
    sources: [appicon.png, 'appicon.icon/**/*']
    generates: [darwin/icons.icns, darwin/Assets.car]
    cmds:
      - mkdir -p windows
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  dev:frontend:
    cmds:
      - task: install:frontend:deps
      - npm run dev --prefix frontend -- --port {{.VITE_PORT}} --strictPort
