version: '3'
info:
  companyName: "Hermit contributors"
  productName: "Hermit"
  productIdentifier: "local.hermit.app"
  description: "Fixed local ports for explicit proxy nodes"
  copyright: "© 2026 Hermit contributors"
  version: "1.1.0"
  cfBundleIconName: "appicon"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore, .gitkeep, "*_test.go"]
    watched_extension: ["*.go", "*.js", "*.ts"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
